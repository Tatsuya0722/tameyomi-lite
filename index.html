<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>気力じゃんけん</title><style>:root{font:16px system-ui,sans-serif;color:#182230;background:#f3f4f6;color-scheme:light;touch-action:none}*{box-sizing:border-box}body{margin:0;position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;overscroll-behavior:none}main{width:min(100%,560px);height:min(100dvh,430px);padding:16px;display:grid;grid-template-rows:32px 40px minmax(34px,1fr) minmax(66px,110px) 36px 22px;gap:10px;text-align:center}header{display:flex;justify-content:space-between;align-items:center}header b{font-size:24px;margin-left:8px}p{margin:0}.energy{align-self:center}.energy b{font-size:30px;margin:0 16px}#status{align-self:center;font-weight:700}.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{font:700 20px system-ui;cursor:pointer;border:1px solid #cbd1da;border-radius:10px;padding:4px;touch-action:none}button small,button span{font-size:14px;font-weight:400}button span{display:block;margin-top:12px}.attack{background:#ffe4e4;color:#8f2424;border-color:#e8b9b9}.defend{background:#dfedff;color:#164883;border-color:#b4cee9}.charge{background:#fff0c4;color:#674600;border-color:#dbc17b}button:disabled{background:#e5e7eb;color:#667085;border-color:#d1d5db;cursor:default}button:focus-visible{outline:3px solid #2563eb;outline-offset:2px}button:enabled:active{transform:translateY(1px)}#next{visibility:hidden;font-size:16px;background:#fff}#last{font-size:13px;align-self:center;color:#475467}@media(max-height:340px){main{padding:8px;gap:6px;grid-template-rows:24px 30px 24px minmax(56px,1fr) 28px 18px}header b,.energy b{font-size:22px}button span{margin-top:4px}}</style><main><header><span>あなた <b id=hw>0勝</b></span><span>CPU <b id=cw>0勝</b></span></header><p class=energy>気力 <b id=he>0</b> − <b id=ce>0</b></p><p id=status role=status>手を選んでください</p><div class=moves><button class=attack disabled>攻撃 <small>−2</small><span>CPU 0</span></button><button class=defend disabled>防御 <small>−1</small><span>CPU 0</span></button><button class=charge disabled>ため <small>＋1</small><span>CPU 255</span></button></div><button id=next>次のゲーム</button><p id=last>攻撃 × ためで決着。それ以外は続行。</p></main><script>(()=>{const T="          ＠张垇㒣ᯜ௥＠氠硲侌㢲◁＠＠ꑘ桾䲟㞳＠＠앋蕲憐䢨";function P(x,y){let v=T.charCodeAt(Math.min(x,5)*6+Math.min(y,5))-32,a=v>>8,b=v&255;return x>=2*y+2?[255,0,0]:[a,b,255-a-b]}const $=id=>document.getElementById(id),B=[...document.querySelectorAll('.moves button')],N=['攻撃','防御','ため'],D=[-2,-1,1],R=new Uint8Array(1);let c=0,h=0,a=2,w=0,l=0,O=false;function F(){const q=P(c,h);do crypto.getRandomValues(R);while(R[0]===255);a=R[0]<q[0]?0:R[0]<q[0]+q[1]?1:2;$('he').textContent=h;$('ce').textContent=c;$('hw').textContent=w+'勝';$('cw').textContent=l+'勝';B.forEach((b,i)=>{b.disabled=O||h+D[i]<0;b.lastElementChild.textContent='CPU '+q[i]});$('next').style.visibility=O?'visible':'hidden';}B.forEach((E,b)=>E.onclick=()=>{if(O||h+D[b]<0)return;const W=b===0&&a===2,L=a===0&&b===2;$('last').textContent='あなた '+N[b]+' ／ CPU '+N[a];h+=D[b];c+=D[a];O=W||L;w+=W;l+=L;$('status').textContent=W?'あなたの勝ち':L?'CPUの勝ち':'手を選んでください';F();});$('next').onclick=()=>{if(!O)return;c=h=0;O=false;$('status').textContent='手を選んでください';$('last').textContent='攻撃 × ためで決着。それ以外は続行。';F()};document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&'+-=0'.includes(e.key))e.preventDefault()});document.addEventListener('gesturestart',e=>e.preventDefault());F();})();</script></html>
