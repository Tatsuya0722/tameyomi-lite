    /><meta name=theme-color content="#f3f4f6" /><meta name=color-scheme content=light /><meta name=description content="気力を読み合う、資源付きじゃんけん。" /><title>ためよみ！</title><style>:root{--bg:#f3f4f6;--panel:#ffffff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--attack:#dc2626;--defend:#2563eb;--charge:#059669;}*{box-sizing:border-box;}html,body{width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-text-size-adjust:100%;}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(7px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}.game{width:min(680px,100%);max-height:calc(100dvh - 14px);padding:clamp(11px,3vh,22px);display:grid;grid-template-rows:auto auto auto minmax(90px,118px) auto;gap:clamp(8px,2.2vh,17px);overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 32px rgb(0 0 0 / 8%);}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:4px 6px;}.score-side{display:flex;align-items:baseline;gap:10px;min-width:0;}.score-side.player{justify-content:flex-end;}.score-side.cpu{justify-content:flex-start;}.score-label{color:var(--muted);font-size:1.2rem;font-weight:750;}.score strong{color:var(--text);font-size:clamp(2.25rem,7vh,2.8rem);line-height:1;font-weight:950;letter-spacing:-0.05em;font-variant-numeric:tabular-nums;white-space:nowrap;}.score-dash{color:#9ca3af;font-size:1.7rem;}.energy{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:11px;padding:9px 12px;border-radius:12px;background:#f9fafb;color:var(--muted);font-size:1rem;}.energy-title{color:#9ca3af;font-size:0.8rem;font-weight:850;letter-spacing:0.08em;}.energy-side{di
